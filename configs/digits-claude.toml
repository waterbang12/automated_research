# Real run with Claude. Requires ANTHROPIC_API_KEY in the environment.
[run]
name = "digits-claude"
domain = "digits"
# objective = "..."            # optional; overrides the domain's default objective
max_experiments = 8
budget_usd = 2.00               # hard cap on API spend for this run (raising it later needs --approve)
workers = 2
hypotheses_per_round = 2
max_fix_attempts = 2
llm_validation_retries = 2
llm_analysis = true

[llm]
provider = "anthropic"
model = "claude-opus-5-5"
effort = "medium"
max_tokens = 16000
anthropic_fallbacks = true      # server-side refusal fallback (beta); set false to disable

# Optional per-role overrides, e.g. a cheaper analyst:
# [llm.roles.analyst]
# provider = "anthropic"
# model = "claude-haiku-5-5"

[sandbox]
image = "autoresearch-sandbox:1"
timeout_s = 120
memory = "1g"
cpus = 1.0
pids = 128
network = "none"

# USD per 1M tokens [input, output]. Verify against current price lists.
[pricing]
"claude-opus-5-5" = [4.0, 20.0]
"claude-sonnet-5-5" = [2.0, 10.0]
"claude-haiku-5-5" = [0.10, 0.50]
"claude-fable-5-1" = [10.0, 50.0]
